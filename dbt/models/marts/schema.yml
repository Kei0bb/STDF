version: 2
models:
  - name: lot_yield_summary
    description: "ロット別歩留まりサマリ(gross-die 対応)。1行=(product, test_category, sub_process, lot_id) — lot_id 単体はグローバルに一意ではない(同じ lot_id が CP/FT 両方で ingest され得る)。"
    columns:
      - name: lot_id
        tests: [not_null]
  - name: fail_ranking
    description: "ロット×テスト別 Fail 数/率。fails>0 のみ。WHERE lot_id で絞って使う。"
    columns:
      - name: lot_id
        tests: [not_null]
  - name: cpk_stats
    description: "ロット×テスト別の n/mean/sigma/Cp/Cpk(PTR/MPR・両リミット有りのみ)。"
    columns:
      - name: lot_id
        tests: [not_null]
  - name: bin_pareto
    description: "ロット別 hard/soft ビン分布。gd_fail_bin(未プローブ)行を含む。"
  - name: bin_fail_tests
    description: "Fail ダイのビン × Fail テストの紐付け。"
