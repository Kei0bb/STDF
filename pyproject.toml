[project]
name = "stdf2pq"
version = "0.2.0"
description = "stdf - STDF to Parquet converter and analysis DB"
readme = "README.md"
# 上限 <3.14 は dbt-core 1.11 の mashumaro ピンが理由だった。dbt を外したので
# 制約は消えたが、.python-version は 3.13 のまま固定しておく — 検証済みの
# 処理系を全マシンで揃えるため。3.14 に上げたくなったら .python-version を
# 変えて uv sync し、テストを通してから。
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "plotly>=5.20.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.50.0",
]

[project.scripts]
stdf = "stdf_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stdf_platform"]

[tool.hatch.build.targets.sdist]
include = ["src/stdf_platform"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep tool caches out of the project root; var/ is the single runtime
# directory (data, downloads, logs, test_data) and is gitignored whole.
cache_dir = "var/.pytest_cache"

[tool.ruff]
cache-dir = "var/.ruff_cache"
