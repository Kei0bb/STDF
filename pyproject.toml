[project]
name = "stdf2pq"
version = "0.2.0"
description = "stdf - STDF to Parquet converter and analysis DB"
readme = "README.md"
# 上限 <3.14 は dbt-core 1.11 の mashumaro ピンが理由だった。dbt を外したので
# 制約は消えたが、.python-version は 3.13 のまま固定しておく — 検証済みの
# 処理系を全マシンで揃えるため。3.14 に上げたくなったら .python-version を
# 変えて uv sync し、テストを通してから。
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
]

[project.scripts]
stdf = "stdf_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stdf_platform"]

[tool.hatch.build.targets.sdist]
include = ["src/stdf_platform"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0.0",
]
notebook = [
    "marimo>=0.25.2",
    # mo.sql を engine 無し(DuckDB 既定接続)で使うのに必須。pure Python(Win11 でも wheel で入る)。
    # marimo[sql] の sqlglot[c] はコンパイル済み拡張なので使わない。
    "sqlglot>=30.7.0",
    # ノートブックのグラフ用(marimo が altair_chart として描画し、ツールチップも付く)。
    # pure Python + wheel のみ(Win11 でも入る)。
    "altair>=5.5.0",
]

# 共有 marimo サーバ: 全員が同じアカウントで動くので、AI 補完の設定(API キー、
# 社外への送信)を個人に持たせない。データを LAN の外に出さないための固定。
[tool.marimo.ai]
enabled = false
allow_provider_config = false

[tool.marimo.completion]
copilot = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep tool caches out of the project root; var/ is the single runtime
# directory (data, downloads, logs, test_data) and is gitignored whole.
cache_dir = "var/.pytest_cache"

[tool.ruff]
cache-dir = "var/.ruff_cache"
